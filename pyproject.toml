[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogvideox-api"
version = "0.1.0"
description = "Python client for a CogVideoX-class video generation API: image-to-video and text-to-video through hosted endpoints"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "cogvideox-dev"}]
keywords = ["ai api", "cogvideox", "cogvideox api", "cogvideox python", "seedance-2.5", "synexa", "wan2.2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/cogvideox-dev/cogvideox-api"
Documentation = "https://cogvideox-dev.github.io/cogvideox-api/"
"Hosted model" = "https://synexa.ai/explore/tongyi/wan2.2?utm_source=github&utm_medium=ugc&utm_campaign=cogvideox-dev&utm_content=pyproject&utm_term=tier-a"

[tool.setuptools.packages.find]
include = ["cogvideox_api*"]
